<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0F14">
<meta name="color-scheme" content="dark">
<meta name="description" content="Mi Mejor Versión: entrenos, hábitos y comidas, todo guardado en tu dispositivo.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Mi Mejor Versión</title>
<style>html,body{background:#0A0F14;color:#E6EDF3;margin:0;font-family:system-ui,sans-serif}</style>
</head>
<body>
<div id="root"></div>
<script>
// Si la app no arranca (pantalla negra), muestra la causa y un botón que limpia solo la caché (no toca tus datos).
(function(){var errs=[];
addEventListener('error',function(e){errs.push(e.message||'error de carga')});
addEventListener('unhandledrejection',function(e){errs.push(String(e.reason))});
function mostrar(){var r=document.getElementById('root');if(!r||r.children.length)return;
r.innerHTML='<div style="padding:24px;max-width:480px;margin:auto"><h2>La app no arrancó</h2><p>Tus datos no se borraron. Tocá «Reparar» para limpiar la caché y recargar.</p><pre style="white-space:pre-wrap;font-size:12px;opacity:.8"></pre><button id="rep" style="padding:12px 20px;font-size:16px">Reparar</button></div>';
r.querySelector('pre').textContent=(errs.join('\n')||'sin mensaje')+'\n'+location.href;
document.getElementById('rep').onclick=function(){Promise.resolve().then(function(){return caches.keys()}).then(function(k){return Promise.all(k.map(function(x){return caches.delete(x)}))}).then(function(){return navigator.serviceWorker.getRegistrations()}).then(function(rs){return Promise.all(rs.map(function(x){return x.unregister()}))}).catch(function(){}).then(function(){location.reload()})}}
setTimeout(mostrar,5000)})()
</script>
<noscript>Mi Mejor Versión necesita JavaScript para funcionar.</noscript>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
