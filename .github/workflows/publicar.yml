# Publica MMV en Cloudflare Pages cada vez que subís cambios a GitHub.
# La compilación y las pruebas corren en los servidores de GitHub (no en tu PC).
# Si alguna prueba falla, NO se publica.
name: Publicar MMV

on:
  push:
    branches: [main, prueba]
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # rama main = producción (mmv-bribay.pages.dev); rama prueba = dirección de prueba aparte
      - name: Publicar en Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mmv-bribay --branch=${{ github.ref_name }}
