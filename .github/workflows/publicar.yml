# Prueba y compila MMV en los servidores de GitHub (no en tu PC).
# Si alguna prueba falla, no se genera nada. El resultado queda para descargar en Actions.
name: Compilar MMV

on:
  push:
    branches: [main, prueba]
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: mmv-app-${{ github.ref_name }}
          path: dist
          retention-days: 30
